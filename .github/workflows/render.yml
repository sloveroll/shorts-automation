name: Render Shorts Automation

on:
  workflow_dispatch: # GitHub에서 수동으로 버튼을 눌러서 실행
  schedule:
    - cron: '0 23 * * *' # 매일 UTC 23:00 (한국 시간 아침 8시)

permissions:
  contents: write

jobs:
  render:
    name: Generate Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Root)
        run: npm install

      - name: Install dependencies (Video/Remotion)
        working-directory: ./video
        run: npm install

      - name: Install Linux Dependencies (FFmpeg & Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Ensure Remotion Browser
        working-directory: ./video
        run: npx remotion browser ensure

      - name: Run Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node src/main.js

      - name: Save Used Topics History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f used_topics.txt
          git commit -m "chore: update used topics history [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Generated Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final_shorts
          path: '*_shorts_*.mp4'
          retention-days: 7
